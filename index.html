.palette{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}

/* Face ID: a passkey on this phone unlocks the saved session */
const FID="aharon-faceid";
const getFid=()=>{try{return localStorage.getItem(FID)}catch(e){return null}};
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
async function canFaceId(){try{return !!(window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())}catch(e){return false}}
async function enableFaceId(){
  try{
    const cred=await navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:"אהרן מערכות"},
      user:{id:rnd(16),name:"aharonsystems@gmail.com",displayName:"אהרן"},
      pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],
      authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required",residentKey:"preferred"},timeout:60000}});
    localStorage.setItem(FID,b64(cred.rawId));toast("Face ID הופעל");return true;
  }catch(e){toast("Face ID לא הופעל: "+fidErr(e));return false}
}
let fidBusy=false;
async function unlock(){
  if(fidBusy)return;fidBusy=true;
  try{
    await navigator.credentials.get({publicKey:{challenge:rnd(32),allowCredentials:[{type:"public-key",id:unb64(getFid())}],userVerification:"required",timeout:60000}});
    fidBusy=false;$("#lock").hidden=true;showApp();
  }catch(e){
    fidBusy=false;
    // Face ID failed (often: the passkey was saved in another browser). Forget it so it can be set up again here after the password login.
    try{localStorage.removeItem(FID);localStorage.removeItem(FID+"-asked")}catch(x){}
    $("#lock").hidden=true;$("#app").hidden=true;$("#login").hidden=false;
    $("#faceLoginBtn").hidden=true;
    msg("Face ID לא עבד. היכנס עם הסיסמה, ומיד אחר כך האפליקציה תציע להגדיר Face ID מחדש במכשיר הזה.");
    setTimeout(()=>$("#pass").focus(),300);
  }
}
$("#faceLoginBtn").addEventListener("click",()=>{msg("");unlock()});
function fidErr(e){const n=e&&e.name||"";
  if(n==="NotAllowedError")return "בוטל או שהאייפון לא אפשר כאן";
  if(n==="SecurityError")return "הדפדפן הזה חוסם Face ID – פתח מהאייקון במסך הבית";
  if(n==="InvalidStateError")return "כבר מוגדר במכשיר הזה";
  if(n==="NotSupportedError")return "המכשיר לא תומך";
  return n||"שגיאה לא ידועה"}
$("#unlockBtn").addEventListener("click",unlock);
$("#lockPass").addEventListener("click",async()=>{try{localStorage.removeItem(FID)}catch(e){}$("#lock").hidden=true;await sb.auth.signOut();showLogin()});
async function offerFaceId(){
  if(getFid()||!(await canFaceId()))return;
  try{if(localStorage.getItem(FID+"-asked"))return;localStorage.setItem(FID+"-asked","1")}catch(e){}
  const el=$("#sheet");
  el.innerHTML=`<form id="fo" novalidate><h3>כניסה מהירה עם Face ID</h3><div class="note">בפעם הבאה שתפתח את האפליקציה, תיכנס עם הפנים במקום סיסמה.</div>
   <div class="actions"><button class="btn" type="submit">הפעלה</button><button class="btn ghost" type="button" data-close>לא עכשיו</button></div></form>`;
  el.hidden=false;el.onclick=e=>{if(e.target===el||e.target.closest("[data-close]"))el.hidden=true};
  $("#fo").onsubmit=async e=>{e.preventDefault();el.hidden=true;await enableFaceId()};
}

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  // stay logged in: open straight to the data (the phone's own Face ID lock protects it)
  try{localStorage.removeItem(FID)}catch(x){}
  if(session){showApp()}else{showLogin()}
  sb.auth.onAuthStateChange((ev,s)=>{
    if(ev==="SIGNED_OUT")showLogin();
    if(ev==="SIGNED_IN"&&$("#app").hidden&&$("#lock").hidden)showApp();
    if(ev==="PASSWORD_RECOVERY")setTimeout(newPassword,300);
  });
}
function newPassword(){
  const el=$("#sheet");
  el.innerHTML=`<form id="np" novalidate><h3>בחירת סיסמה חדשה</h3><div class="f"><label for="np1">סיסמה חדשה (8 תווים לפחות)</label><input id="np1" type="password" autocomplete="new-password" dir="ltr"></div>
   <div class="actions"><button class="btn" type="submit">שמירה</button></div></form>`;
  el.hidden=false;el.onclick=null;
  $("#np").onsubmit=async e=>{e.preventDefault();const p=$("#np1").value;if(p.length<8){toast("8 תווים לפחות");return}
    const {error}=await sb.auth.updateUser({password:p});if(error){toast("לא נשמר: "+error.message);return}
    el.hidden=true;toast("הסיסמה עודכנה");history.replaceState(null,"",location.pathname)};
}
function showLogin(){$("#app").hidden=true;$("#login").hidden=false}
function showApp(){$("#login").hidden=true;$("#app").hidden=false;render();loadAll()}
const msg=t=>$("#loginMsg").textContent=t;
const creds=()=>({email:$("#email").value.trim(),password:$("#pass").value});
$("#loginForm").addEventListener("submit",async e=>{
  e.preventDefault();const c=creds();if(!c.password){msg("הכנס סיסמה");return}
  $("#loginBtn").disabled=true;msg("נכנס…");
  const {error}=await sb.auth.signInWithPassword(c);
  $("#loginBtn").disabled=false;
  if(error){msg(/confirm/i.test(error.message)?"צריך קודם לאשר את המייל: פתח את המייל מ-Supabase ולחץ על הקישור.":"מייל או סיסמה לא נכונים.");return}
  msg("");showApp();
});
$("#resetBtn").addEventListener("click",async()=>{
  const {email}=creds();msg("שולח…");
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.href.split("#")[0]+"#reset"});
  msg(error?"לא הצלחתי לשלוח: "+error.message:"נשלח מייל לאיפוס סיסמה.");

/* ---------- data ---------- */
async function loadAll(){
  $("#status").textContent="טוען…";
  try{
    const tables=["jobs","stock","tasks","debts","expenses","morning_docs","projects","quote_followups"];
    const res=await Promise.all(tables.map(t=>sb.from(t).select("*").limit(5000)));
    res.forEach((r,i)=>{if(r.error)throw r.error;data[tables[i]]=r.data||[]});
    const lg=await sb.from("sync_log").select("at,ok,message").order("at",{ascending:false}).limit(1);
    lastSync=lg.data&&lg.data[0]||null;
    loaded=true;updateBadge();
    $("#status").textContent=lastSync?`Morning: ${new Date(lastSync.at).toLocaleString("he-IL",{day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit"})}${lastSync.ok?"":" (שגיאה)"}`:"Morning: עוד לא סונכרן";
    if($("#sheet").hidden)render();
  }catch(err){$("#status").textContent="אין חיבור לנתונים";toast("הנתונים לא נטענו. בדוק אינטרנט ונסה שוב.")}
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!$("#app").hidden)loadAll()});
$("#syncBtn").addEventListener("click",async()=>{
  const b=$("#syncBtn");b.disabled=true;b.textContent="מסנכרן…";
  try{const {data:r,error}=await sb.functions.invoke("morning-sync",{body:{}});if(error)throw error;toast(r&&r.message?r.message:"סונכרן");await loadAll()}
  catch(e){toast("הסנכרון נכשל")}
  b.disabled=false;b.textContent="סנכרון Morning";
});

/* ---------- views ---------- */
function render(){
  document.querySelectorAll("#nav button").forEach(b=>{if(b.dataset.tab===tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  const m=$("#main");
  if(!loaded){m.innerHTML=`<div class="list"><div class="empty">טוען נתונים…</div></div>`;return}
  if(tab==="home"){m.innerHTML=home();return}
  if(tab==="quotes"){m.innerHTML=quotesView();return}
  if(tab==="projects"&&curProject){projectView(m);return}
  if(tab==="jobs"&&curJob){jobView(m);return}
  m.innerHTML=listView(tab);
  const s=$("#q");if(s){s.value=q;s.oninput=()=>{q=s.value.trim();m.querySelector(".list").outerHTML=listBody(tab)}}
}

/* ---------- quotes: follow-up pipeline ---------- */
const QST=["פתוחה","בטיפול","זכינו","הפסדנו","לא רלוונטי"];
const addDays=(d,n)=>{const t=new Date(String(d||today()).slice(0,10)+"T12:00:00Z");t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)};
const daysSince=d=>d?Math.round((Date.parse(today())-Date.parse(String(d).slice(0,10)))/864e5):0;
const activeQ=f=>f.status==="פתוחה"||f.status==="בטיפול";
function fu(d){return data.quote_followups.find(f=>f.doc_id===d.id)||{doc_id:d.id,status:"פתוחה",next_date:addDays(d.doc_date,3),contacts:0}}
function quotePhone(d,f){if(f.phone)return f.phone;if(d.client_phone)return d.client_phone;const c=String(d.client||"").trim();
  const j=c&&data.jobs.find(j=>j.phone&&j.client&&(j.client.includes(c)||c.includes(j.client)));return j?j.phone:""}
function isDue(d){const f=fu(d);return activeQ(f)&&!!f.next_date&&f.next_date<=today()}
function dueQuotes(){return openQuotes().filter(isDue)}
function updateBadge(){try{const n=dueQuotes().length;if(navigator.setAppBadge){n?navigator.setAppBadge(n):navigator.clearAppBadge()}}catch(e){}}
async function saveFu(doc_id,patch){
  const cur=data.quote_followups.find(f=>f.doc_id===doc_id);
  const row=Object.assign({doc_id,status:"פתוחה",contacts:0},cur||{},patch,{updated_at:new Date().toISOString()});
  const {data:r,error}=await sb.from("quote_followups").upsert(row).select().single();
  if(error){toast("השמירה נכשלה. נסה שוב.");return null}
  const i=data.quote_followups.findIndex(f=>f.doc_id===doc_id);if(i>=0)data.quote_followups[i]=r;else data.quote_followups.push(r);
  updateBadge();return r;
}
function quoteText(d){
  return `שלום ${d.client||""},\nכאן אהרן מאהרן מערכות.\nרציתי לבדוק אם עברת על הצעת המחיר ששלחתי (מס׳ ${d.number}${d.description?" – "+d.description:""}).\nאשמח לענות על כל שאלה ולתאם מועד התקנה.\n${d.url?"ההצעה: "+d.url+"\n":""}אהרן מערכות · ${BIZ_PHONE}`;
}
function quoteRow(d){
  const f=fu(d),age=daysSince(d.doc_date);let p;
  if(activeQ(f)){const late=f.next_date&&f.next_date<today();p=isDue(d)?`<span class="pill bad">${late?"באיחור "+daysSince(f.next_date)+" ימים":"לחזור היום"}</span>`:`<span class="pill">לחזור ${heDate(f.next_date)}</span>`}
  else p=`<span class="pill ${f.status==="זכינו"?"good":""}">${esc(f.status)}</span>`;
  const s=[`הצעה ${d.number}`,age>0?`לפני ${age} ימים`:"היום",f.status==="בטיפול"?"בטיפול":"",f.contacts?`פניתי ${f.contacts}×`:"",quotePhone(d,f)?"":"אין טלפון",d.description||""].filter(Boolean).join(" · ");
  return `<button type="button" class="row" data-quote="${esc(d.id)}"><span class="t">${esc(d.client||"")}</span><span class="n">${ils(d.amount)}</span><span class="s">${esc(s)}</span><span class="p">${p}</span></button>`;
}
function quotesView(){
  const cur=filt.quotes||"active", all=openQuotes();

  <div class="note">הצעות פתוחות ב־Morning. לכל הצעה יש תאריך לחזור ללקוח (בהתחלה: 3 ימים אחרי ההצעה). שליחת וואטסאפ מהכרטיס דוחה אוטומטית ב־3 ימים.</div>
  <div class="filters" role="group" aria-label="סינון">${[["active","לטיפול"],["due",`להיום (${nDue})`],["closed","נסגרו"],["all","הכל"]].map(([v,l])=>`<button type="button" class="chipbtn" data-filt="${v}" aria-pressed="${v===cur}">${l}</button>`).join("")}</div>
  <div class="list">${qs.length?qs.map(quoteRow).join(""):`<div class="empty">${cur==="due"?"אין הצעות לחזור אליהן היום 👍":"אין הצעות כאן."}</div>`}<div class="sum"><span>${qs.length} הצעות</span><span>${ils(qs.reduce((a,d)=>a+num(d.amount),0))}</span></div></div>`;

  const d=data.morning_docs.find(x=>x.id===id);if(!d)return;

   <div class="f"><label for="q_phone">טלפון</label><input id="q_phone" type="tel" dir="ltr" value="${esc(quotePhone(d,f))}" placeholder="05x-xxxxxxx"></div>

   <div class="filters">${[["מחר",1],["3 ימים",3],["שבוע",7],["שבועיים",14]].map(([l,n])=>`<button type="button" class="chipbtn" data-days="${n}">${l}</button>`).join("")}</div>

   <div class="f"><label for="q_notes">הערות (מה הלקוח אמר)</label><textarea id="q_notes">${esc(f.notes||"")}</textarea></div>
   ${job?`<button class="btn ghost" type="button" data-open-job="${esc(job.id)}">פתיחת העבודה של ההצעה</button>`:`<button class="btn ghost" type="button" id="q_won">🎉 זכינו – לפתוח עבודה</button>`}
   <div class="actions"><button class="btn" type="submit">שמירה</button><button class="btn ghost" type="button" data-close>סגירה</button></div></form>`;

const FILTERS={
 jobs:[["all","הכל"],["owed","חייבים"],["unknown","לא ידוע"],["paid","שולם"]],
 stock:[["all","הכל"],["have","יש במלאי"],["low","חסר"],["morning","מ-Morning"]],
 projects:[["active","פעילים"],["done","הסתיימו"],["all","הכל"]],
 tasks:[["open","פתוח"],["done","בוצע"],["all","הכל"]],
 debts:[["open","פתוח"],["tax","מיסים"],["paid","שולם"],["all","הכל"]],
 expenses:[["all","הכל"],["year","השנה"],["month","החודש"]]
};
function pass(k,x){
  const f=filt[k]||FILTERS[k][0][0];
  if(q){const s=Object.values(x).join(" ");if(!s.includes(q))return false}
  switch(k+":"+f){
   case "jobs:owed":return owedOf(x)>0; case "jobs:unknown":return !x.paid||x.paid==="לא ידוע"; case "jobs:paid":return x.paid==="כן";
   case "stock:low":return num(x.min_qty)>0&&num(x.qty)<=num(x.min_qty);
   case "stock:have":return num(x.qty)>0; case "stock:morning":return !!x.morning_item_id;
   case "projects:active":return x.status!=="הסתיים"; case "projects:done":return x.status==="הסתיים";
   case "tasks:open":return x.done!=="בוצע"; case "tasks:done":return x.done==="בוצע";
   case "debts:open":return x.paid!=="שולם"; case "debts:paid":return x.paid==="שולם"; case "debts:tax":return TAX.includes(x.cat);
   case "expenses:year":return (x.date||"").startsWith(String(new Date().getFullYear())); case "expenses:month":return (x.date||"").startsWith(today().slice(0,7));
  }
  return true;
}
function sorted(k){
  const a=data[k].slice();
  if(k==="jobs"||k==="expenses")a.sort((x,y)=>(y.date||"").localeCompare(x.date||""));
  else if(k==="projects")a.sort((x,y)=>String(y.created_at).localeCompare(String(x.created_at)));
  else if(k==="stock")a.sort((x,y)=>(num(y.qty)>0)-(num(x.qty)>0)||String(x.name||"").localeCompare(String(y.name||""),"he"));
  else if(k==="tasks")a.sort((x,y)=>(x.date||"9").localeCompare(y.date||"9"));
  else if(k==="debts")a.sort((x,y)=>num(y.amount)-num(x.amount));
  else a.sort((x,y)=>String(x.name||"").localeCompare(String(y.name||""),"he"));
  return a;
}

async function compress(file,max=1600,q=.82){
  const im=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(file)});
  const sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
  const c=document.createElement("canvas");c.width=Math.round(im.naturalWidth*sc);c.height=Math.round(im.naturalHeight*sc);

}

const TESS="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
async function readLabel(canvas){
  await loadScript(TESS);

function parseLabel(text){
  const T=text.replace(/[|]/g,"I").replace(/[“”]/g,'"');
  const up=T.toUpperCase();
  const out={};
  const brands=[["HIKVISION","Hikvision"],["DAHUA","Dahua"],["ALHUA","Dahua"],["PROVISION","Provision"],["UNIVIEW","Uniview"],["EZVIZ","EZVIZ"],["IMOU","Imou"],["TP-LINK","TP-Link"],["TPLINK","TP-Link"],["UBIQUITI","Ubiquiti"],["UNIFI","Ubiquiti"],["HILOOK","HiLook"],["WESTERN DIGITAL","Western Digital"],["SEAGATE","Seagate"],["RISCO","Risco"],["PIMA","Pima"],["PARADOX","Paradox"],["AJAX","Ajax"],["2N","2N"],["AXIS","Axis"]];
  for(const [k,v] of brands)if(up.includes(k)){out.brand=v;break}
  let m=T.match(/(?:MODEL|MOD\.?|P\/N|TYPE)\s*(?:NO\.?)?\s*[:：]?\s*([A-Z0-9][A-Z0-9\-\/().+]{4,})/i);
  if(!m)m=up.match(/\b(DS-[0-9A-Z]{2,}[0-9A-Z\-\/()]*)/);
  if(!m)m=up.match(/\b((?:DH-|DHI-)?(?:IPC|HAC|SD|NVR|XVR|DVR|VTO|VTH|PFS)[-0-9A-Z]{3,}[0-9A-Z\-\/()]*)/);
  if(!m)m=up.match(/\b((?:WD|ST)[0-9]{2,}[A-Z0-9]{2,})\b/);
  if(m)out.model=m[1].replace(/[.,;:]+$/,"");
  const s=T.match(/(?:S\/N|SN|SERIAL(?:\s*NO\.?)?)\s*[:：]?\s*([A-Z0-9][A-Z0-9\-]{5,})/i);
  if(s)out.serial=s[1];
  if(!out.brand&&out.model){const md=out.model.toUpperCase();if(md.startsWith("DS-"))out.brand="Hikvision";else if(/^(DH-|DHI-|IPC-|HAC-|SD|NVR|XVR|VTO|VTH)/.test(md))out.brand="Dahua";else if(/^WD/.test(md))out.brand="Western Digital";else if(/^ST\d/.test(md))out.brand="Seagate"}
  return out;
}
function hebrewName(brand,model){
  const md=String(model||"").toUpperCase();let type="",mp="",cat="";
  const dig=md.replace(/^[^0-9]*/,"").match(/\d{3,4}/);const d=dig?dig[0]:"";
  if(/NVR|DS-7[6-9]|DS-96/.test(md)){const ch=(md.match(/(?:NVR\d{2}|DS-7\d)(\d{2})/)||[])[1];type="מקליט NVR"+(ch?` ${+ch} ערוצים`:"");cat="מקליטים"}
  else if(/XVR|DVR|DS-72/.test(md)){type="מקליט DVR";cat="מקליטים"}
  else if(/^(DH-)?SD|DS-2DE|PTZ/.test(md)){type="מצלמת PTZ ממונעת";cat="מצלמות"}
  else if(/HFW|BULLET/.test(md)){type="מצלמת צינור";cat="מצלמות"}
  else if(/HDBW|DOME/.test(md)){type="מצלמת כיפה";cat="מצלמות"}
  else if(/HDW|TURRET|EYEBALL/.test(md)){type="מצלמת טורט";cat="מצלמות"}
  else if(/DS-2CD/.test(md)){const t=(md.match(/DS-2CD\d([0-9A-Z])/)||[])[1];type=({"0":"מצלמת צינור","T":"מצלמת צינור","6":"מצלמת צינור","1":"מצלמת כיפה","7":"מצלמת כיפה","5":"מצלמת כיפה","3":"מצלמת טורט"})[t]||"מצלמת IP";cat="מצלמות"}
  else if(/VTO/.test(md)){type="אינטרקום – פאנל כניסה";cat="אינטרקום"}
  else if(/VTH/.test(md)){type="אינטרקום – מסך פנימי";cat="אינטרקום"}
  else if(/PFS|DS-3E|SWITCH|SG\d/.test(md)){type="סוויץ׳";cat="תקשורת"}
  else if(/^(WD|ST)\d/.test(md)){type="דיסק קשיח";cat="מקליטים"}
  if(cat==="מצלמות"&&d){const x=/DS-2CD/.test(md)?d[2]:d[1];if(x&&+x>=2&&+x<=8)mp=`${x}MP`}
  return {name:[type||"מוצר",mp,brand,model].filter(Boolean).join(" ").trim(),category:cat};
}

    }catch(e){}
  }
  // 2) public barcode database (if the sticker gave no model)
  if(code&&!pre.model){
    try{const {data:r}=await sb.functions.invoke("items",{body:{action:"barcode",code}});
      if(r&&r.found){pre.name_en=(r.item.name||"").slice(0,80);pre.brand=pre.brand||r.item.brand||"";pre.model=r.item.model||"";pre.name=hebrewName(pre.brand,pre.model).name;note="נמצא במאגר המוצרים הבינלאומי. אפשר לתקן את השם בעברית לפני השמירה."}}catch(e){}
  }
  openSheet("stock",null,pre,note);
}

/* ---------- projects: engineer plan with markers ---------- */
let ptType="cam",selPt=null;const planUrl={};let saveT=null;
function curP(){return data.projects.find(x=>x.id===curProject)}
function cntTotal(p){return Object.keys(PT).reduce((a,k)=>a+cnt(p,k),0)}
function cnt(p,k){return (p.points||[]).filter(x=>x.type===k).length+num((p.manual||{})[k])}
function countsHtml(p){return Object.keys(PT).filter(k=>k!=="other"||cnt(p,k)).map(k=>`<div class="tile"><span>${PT[k].l}</span><b>${cnt(p,k)}</b></div>`).join("")}
function textSheet(p){
  const man=p.manual||{};const el=$("#sheet");
  el.innerHTML=`<form id="tx" novalidate><h3>תיאור הפרויקט בכתב</h3>
   <div class="f"><label for="txd">מה צריך לעשות</label><textarea id="txd" style="min-height:140px" placeholder="לדוגמה: 8 מצלמות חוץ סביב הבניין, 2 בלובי, NVR בארון תקשורת בחדר שירות, נקודת WiFi בכל קומה, 4 רמקולים בלובי">${esc(p.notes||"")}</textarea></div>
   <div class="note">כמויות (בנוסף לסימונים על התוכנית, אם יש):</div>
   <div class="counts">${["cam","net","wifi","audio"].map(k=>`<div class="f"><label for="m_${k}">${PT[k].l}</label><input id="m_${k}" type="number" inputmode="numeric" min="0" value="${esc(man[k]||"")}"></div>`).join("")}</div>
   <div class="actions"><button class="btn" type="submit">שמירה</button><button class="btn ghost" type="button" data-close>סגירה</button></div></form>`;
  el.hidden=false;el.onclick=e=>{if(e.target===el||e.target.closest("[data-close]"))el.hidden=true};
  $("#tx").onsubmit=async e=>{e.preventDefault();
    const manual={};["cam","net","wifi","audio"].forEach(k=>{const v=num($("#m_"+k).value);if(v)manual[k]=v});
    const {error}=await sb.from("projects").update({notes:$("#txd").value.trim(),manual,updated_at:new Date().toISOString()}).eq("id",p.id);
    if(error){toast("השמירה נכשלה");return}el.hidden=true;toast("נשמר");await loadAll()};
}
async function projectView(m){
  const p=curP();if(!p){curProject=null;render();return}
  p.points=p.points||[];
  m.innerHTML=`<div class="bar"><button class="btn ghost" type="button" id="backProj">→ פרויקטים</button><h2 style="flex:1;min-width:0;overflow-wrap:anywhere">${esc(p.name)}</h2><button class="btn ghost" type="button" data-edit="projects" data-id="${esc(p.id)}">פרטים</button></div>
   ${[p.client,p.address,p.status].some(Boolean)?`<div class="note">${esc([p.client,p.address,p.status].filter(Boolean).join(" · "))}</div>`:""}
   ${p.plan_path?`
   <div class="palette" role="group" aria-label="מה לסמן">${Object.entries(PT).map(([k,v])=>`<button type="button" data-pt="${k}" aria-pressed="${k===ptType}"><span class="dot" style="background:${v.c}">${v.s}</span>${v.l}</button>`).join("")}</div>
   <div class="plan" id="plan"><img id="planImg" alt="תוכנית המהנדס" crossorigin="anonymous"><div id="mks"></div></div>
   <div id="selBox"><div class="note" id="planHint">לחץ על התוכנית כדי להוסיף ${PT[ptType].l}. לחיצה על סימון בוחרת אותו לעריכה או מחיקה.</div></div>
   <div class="counts" id="counts">${countsHtml(p)}</div>
   <div class="bar"><button class="btn" type="button" id="sharePlan" style="flex:1">שיתוף התוכנית עם הסימונים</button><label class="btn ghost" style="text-align:center">החלפת תמונה<input type="file" accept="image/*" id="planFile" hidden></label></div>`
   :`<h2>איך להוסיף את הפרויקט?</h2>
   <div class="tiles" style="grid-template-columns:repeat(2,minmax(0,1fr))">
    <label class="tile" style="text-align:center;padding:26px 10px;justify-items:center"><b style="font-size:34px">📐</b><span style="font-size:15px;color:var(--fg);font-weight:700">העלאת תמונה</span><span>תוכנית מהנדס – מצלמים או בוחרים מהגלריה, ומסמנים עליה</span><input type="file" accept="image/*" id="planFile" hidden></label>
    <button class="tile" type="button" id="textProj" style="text-align:center;padding:26px 10px;justify-items:center"><b style="font-size:34px">✍️</b><span style="font-size:15px;color:var(--fg);font-weight:700">הוספה בכתב</span><span>כותבים מה צריך וכמה מכל דבר</span></button>
   </div>
   ${cntTotal(p)?`<div class="counts" id="counts">${countsHtml(p)}</div>`:""}`}
   ${p.notes?`<div class="note" style="white-space:pre-wrap">${esc(p.notes)}</div>`:""}
   <button class="btn ghost" type="button" id="textProj2">${p.notes||Object.keys(p.manual||{}).length?"עריכת התיאור והכמויות":"הוספת תיאור בכתב"}</button>`;
  const f=$("#planFile");if(f)f.onchange=()=>f.files[0]&&uploadPlan(p,f.files[0]);
  if(!p.plan_path)return;
  const img=$("#planImg");
  if(!planUrl[p.plan_path]){const {data:s}=await sb.storage.from("plans").createSignedUrl(p.plan_path,3600*12);planUrl[p.plan_path]=s&&s.signedUrl}
  img.src=planUrl[p.plan_path];
  drawMarkers(p);
  $("#plan").onclick=e=>{
    if(e.target.closest(".mk"))return;
    const r=img.getBoundingClientRect();const x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
    if(x<0||x>1||y<0||y>1)return;
    const n=p.points.filter(q=>q.type===ptType).length+1;
    p.points.push({id:Math.random().toString(36).slice(2,9),type:ptType,x:+x.toFixed(4),y:+y.toFixed(4),label:PT[ptType].s+n});
    selPt=null;afterPoints(p);
  };
}
function drawMarkers(p){
  const box=$("#mks");if(!box)return;
  box.innerHTML=p.points.map(pt=>`<button type="button" class="mk" data-mk="${pt.id}" aria-pressed="${pt.id===selPt}" aria-label="${esc(PT[pt.type].l+" "+(pt.label||""))}" style="left:${pt.x*100}%;top:${pt.y*100}%;background:${PT[pt.type].c}">${esc(pt.label||PT[pt.type].s)}</button>`).join("");
}
function selBox(p){
  const pt=p.points.find(x=>x.id===selPt);const b=$("#selBox");if(!b)return;
  if(!pt){b.innerHTML=`<div class="note">לחץ על התוכנית כדי להוסיף ${PT[ptType].l}. לחיצה על סימון בוחרת אותו לעריכה או מחיקה.</div>`;return}
  b.innerHTML=`<div class="list" style="padding:12px;display:grid;gap:10px"><div class="f"><label for="ptLabel">שם הסימון (${PT[pt.type].l})</label><input id="ptLabel" value="${esc(pt.label||"")}"></div>
   <div class="actions"><button class="btn" type="button" id="ptSave">שמירה</button><button class="btn danger" type="button" id="ptDel">מחיקת הסימון</button><button class="btn ghost" type="button" id="ptCancel">ביטול</button></div></div>`;
}
function afterPoints(p){drawMarkers(p);selBox(p);const c=$("#counts");if(c)c.innerHTML=countsHtml(p);
  clearTimeout(saveT);saveT=setTimeout(async()=>{const {error}=await sb.from("projects").update({points:p.points,updated_at:new Date().toISOString()}).eq("id",p.id);if(error)toast("השמירה נכשלה – בדוק אינטרנט")},600)}
async function uploadPlan(p,file){
  toast("מעלה את התוכנית…");
  try{
    const bmp=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(file)});
    const max=2600,sc=Math.min(1,max/Math.max(bmp.naturalWidth,bmp.naturalHeight));
    const c=document.createElement("canvas");c.width=Math.round(bmp.naturalWidth*sc);c.height=Math.round(bmp.naturalHeight*sc);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const blob=await new Promise(ok=>c.toBlob(ok,"image/jpeg",.85));
    const path=`${p.id}/${Date.now()}.jpg`;
    const {error}=await sb.storage.from("plans").upload(path,blob,{contentType:"image/jpeg",upsert:false});
    if(error)throw error;
    await sb.from("projects").update({plan_path:path,updated_at:new Date().toISOString()}).eq("id",p.id);
    toast("התוכנית נשמרה");await loadAll();
  }catch(e){toast("ההעלאה נכשלה. נסה שוב.")}
}
async function sharePlan(p){
  toast("מכין תמונה…");
  try{
    const img=await new Promise((ok,no)=>{const i=new Image();i.crossOrigin="anonymous";i.onload=()=>ok(i);i.onerror=no;i.src=planUrl[p.plan_path]});
    const W=img.naturalWidth,H=img.naturalHeight,legendH=Math.round(W*.09);
    const c=document.createElement("canvas");c.width=W;c.height=H+legendH;const g=c.getContext("2d");
    g.fillStyle="#fff";g.fillRect(0,0,W,H+legendH);g.drawImage(img,0,0);
    const R=Math.max(14,Math.round(W/70));
    g.textAlign="center";g.textBaseline="middle";
    for(const pt of p.points){const x=pt.x*W,y=pt.y*H;g.beginPath();g.arc(x,y,R,0,Math.PI*2);g.fillStyle=PT[pt.type].c;g.fill();g.lineWidth=Math.max(2,R/6);g.strokeStyle="#fff";g.stroke();
      g.fillStyle="#fff";g.font=`700 ${Math.round(R*.75)}px Heebo, Arial`;g.fillText(pt.label||PT[pt.type].s,x,y+1)}
    g.fillStyle="#0c1d47";g.fillRect(0,H,W,legendH);g.fillStyle="#fff";g.textAlign="right";
    const fs=Math.round(legendH*.32);g.font=`700 ${fs}px Heebo, Arial`;g.direction="rtl";
    const parts=Object.keys(PT).map(k=>[k,cnt(p,k)]).filter(x=>x[1]).map(([k,n])=>`${PT[k].l}: ${n}`);
    g.fillText(`אהרן מערכות · ${p.name}`,W-fs,H+legendH*.33);g.font=`500 ${Math.round(fs*.85)}px Heebo, Arial`;g.fillText(parts.join("   ·   ")||"אין סימונים",W-fs,H+legendH*.72);
    const blob=await new Promise(ok=>c.toBlob(ok,"image/jpeg",.9));
    const file=new File([blob],`${p.name||"plan"}.jpg`,{type:"image/jpeg"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:p.name})}
    else{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=file.name;document.body.appendChild(a);a.click();a.remove()}
  }catch(e){if(e&&e.name!=="AbortError")toast("לא הצלחתי להכין את התמונה")}
}

document.addEventListener("click",async e=>{
  if(e.target.closest("#logout")){try{localStorage.removeItem(FID)}catch(x){}await sb.auth.signOut();return}
  if(e.target.closest("#faceToggle")){if(getFid()){try{localStorage.removeItem(FID)}catch(x){}toast("Face ID כובה")}else if(await canFaceId()){await enableFaceId()}else toast("המכשיר הזה לא תומך ב-Face ID");render();return}
  if(e.target.closest("#backProj")){curProject=null;selPt=null;render();return}
  if(e.target.closest("#backJob")){curJob=null;render();return}
  const oj=e.target.closest("[data-open-job]");if(oj){curJob=oj.dataset.openJob;tab="jobs";render();window.scrollTo(0,0);return}
  if(e.target.closest("#signBtn")){signaturePad(curJ());return}
  const ph=e.target.closest("[data-photo]");if(ph){photoSheet(curJ(),+ph.dataset.photo);return}
  if(e.target.closest("#shareReport")){shareReport(curJ());return}
  const ptb=e.target.closest("[data-pt]");if(ptb){ptType=ptb.dataset.pt;document.querySelectorAll("[data-pt]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.pt===ptType));const p=curP();if(p&&!selPt)selBox(p);return}
  const mk=e.target.closest("[data-mk]");if(mk){selPt=mk.dataset.mk===selPt?null:mk.dataset.mk;const p=curP();drawMarkers(p);selBox(p);return}
  if(e.target.closest("#ptSave")){const p=curP(),pt=p.points.find(x=>x.id===selPt);if(pt)pt.label=$("#ptLabel").value.trim().slice(0,12);selPt=null;afterPoints(p);return}
  if(e.target.closest("#ptDel")){const p=curP();p.points=p.points.filter(x=>x.id!==selPt);selPt=null;afterPoints(p);return}
  if(e.target.closest("#ptCancel")){const p=curP();selPt=null;drawMarkers(p);selBox(p);return}
  if(e.target.closest("#sharePlan")){sharePlan(curP());return}
  if(e.target.closest("#textProj")||e.target.closest("#textProj2")){textSheet(curP());return}
  const qd=e.target.closest("[data-quote]");if(qd){openQuote(qd.dataset.quote);return}
  const g=e.target.closest("[data-go]");if(g){e.preventDefault();if(g.dataset.f)filt[g.dataset.go]=g.dataset.f;go(g.dataset.go);return}
  const n=e.target.closest("[data-new]");if(n){openSheet(n.dataset.new);return}
  const op=e.target.closest("[data-open-project]");if(op){curProject=op.dataset.openProject;render();window.scrollTo(0,0);return}
  if(e.target.closest("#scanBtn")){startScan();return}
  if(e.target.closest("#pullItems")){const b=e.target.closest("#pullItems");b.disabled=true;b.textContent="מושך…";
    const {data:r,error}=await sb.functions.invoke("items",{body:{action:"pull"}});toast(error?"המשיכה נכשלה":(r&&r.message)||"עודכן");await loadAll();return}
  const ed=e.target.closest("[data-edit]");if(ed){openSheet(ed.dataset.edit,ed.dataset.id);return}
  const f=e.target.closest("[data-filt]");if(f){filt[tab]=f.dataset.filt;render()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#sheet").hidden)$("#sheet").hidden=true});

if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
boot();
})();
</script>
